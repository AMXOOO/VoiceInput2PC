plugins { id 'com.android.application' }

def signingNames = [
    'VOICEINPUT2PC_KEYSTORE',
    'VOICEINPUT2PC_STORE_PASSWORD',
    'VOICEINPUT2PC_KEY_ALIAS',
    'VOICEINPUT2PC_KEY_PASSWORD'
]
def signingValues = signingNames.collectEntries { [(it): System.getenv(it)] }
def releaseRequested = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }
if (releaseRequested) {
    def missing = signingNames.findAll { !signingValues[it] }
    if (!missing.isEmpty()) {
        throw new GradleException('Missing release signing environment: ' + missing.join(', '))
    }
}

android {
    namespace 'io.github.amxooo.voiceinput2pc'
    compileSdk 35
    useLibrary 'android.test.runner', false
    useLibrary 'android.test.base', false
    defaultConfig {
        applicationId 'io.github.amxooo.voiceinput2pc'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '0.4.0'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    packagingOptions {
        doNotStrip "**/libtailcat.so"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    signingConfigs {
        release {
            if (signingNames.every { signingValues[it] }) {
                storeFile file(signingValues['VOICEINPUT2PC_KEYSTORE'])
                storePassword signingValues['VOICEINPUT2PC_STORE_PASSWORD']
                keyAlias signingValues['VOICEINPUT2PC_KEY_ALIAS']
                keyPassword signingValues['VOICEINPUT2PC_KEY_PASSWORD']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}
