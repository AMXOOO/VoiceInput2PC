name: Tailcat transport candidate

on:
  pull_request:
  push:
    branches:
      - feat/tailcat-transport-v0.5

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install Python test dependencies
        run: python -m pip install cryptography

      - name: Python pairing and sidecar tests
        run: python -m unittest tests.test_pairing tests.test_tailcat -v

      - name: Java pairing compatibility tests
        run: |
          mkdir -p tests/java-build
          javac -encoding UTF-8 -d tests/java-build \
            android/app/src/main/java/io/github/amxooo/voiceinput2pc/PairingConfig.java \
            android/app/src/main/java/io/github/amxooo/voiceinput2pc/PairingCodec.java \
            tests/PairingCodecTest.java
          java -cp tests/java-build io.github.amxooo.voiceinput2pc.PairingCodecTest

      - name: Fetch pinned Tailcat artifacts
        run: python scripts/fetch_tailcat.py

      - name: Build Android debug APK
        run: gradle -p android :app:assembleDebug --no-daemon

      - name: Verify Tailcat is packaged in APK
        run: unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep 'lib/arm64-v8a/libtailcat.so'

      - uses: actions/upload-artifact@v4
        with:
          name: VoiceInput2PC-Tailcat-Android-candidate
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create build environment
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt

      - name: Build Windows candidate
        shell: pwsh
        run: .\scripts\build_windows_release.ps1

      - name: Smoke-test embedded Tailcat from final Windows ZIP
        shell: pwsh
        run: |
          $testRoot = Join-Path $env:RUNNER_TEMP 'voiceinput2pc-tailcat-smoke'
          Expand-Archive -LiteralPath 'release/output/windows-v0.4.0/VoiceInput2PC-Windows-v0.4.0.zip' -DestinationPath $testRoot -Force
          .\.venv\Scripts\python.exe scripts\verify_tailcat_runtime.py (Join-Path $testRoot '_internal\tailcat\tailcat.exe')

      - uses: actions/upload-artifact@v4
        with:
          name: VoiceInput2PC-Tailcat-Windows-candidate
          path: release/output/windows-v0.4.0/VoiceInput2PC-Windows-v0.4.0.zip
          if-no-files-found: error
