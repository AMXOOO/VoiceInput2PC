<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>VoiceInput2PC isolated acceptance</title>
<style>body{font:20px system-ui;margin:40px;max-width:800px}textarea, [contenteditable]{box-sizing:border-box;width:100%;min-height:130px;border:2px solid #16705b;padding:16px;font:22px system-ui;margin:12px 0 30px}output{white-space:pre-wrap}</style>
<h1>语音输入电脑 · 本地验收</h1>
<p>仅用于自动化测试，不连接外网、不发送聊天消息。</p>
<label for="plain">普通浏览器输入框</label><textarea id="plain" autofocus></textarea>
<label id="rich-label">富文本编辑区域</label><div id="rich" contenteditable="true" role="textbox" aria-labelledby="rich-label"></div>
<output id="result"></output>
<script>
const expected = '语音输入电脑验收：中文，Hello 123 👋。';
const results = () => {
  const plain = document.querySelector('#plain').value;
  const rich = document.querySelector('#rich').textContent;
  document.querySelector('#result').textContent = JSON.stringify({plain,rich,plainExact:plain===expected,richExact:rich===expected},null,2);
};
document.addEventListener('input',results); results();
</script></html>
